<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8fc">
  <title>¿Es primo? — Explorador de números</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #192336;
      --muted: #778196;
      --line: #e8ebf2;
      --paper: #fff;
      --bg: #f7f8fc;
      --accent: #6558e8;
      --accent-dark: #5143d2;
      --green: #16865f;
      --red: #d25265;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 18px;
      color: var(--ink);
      background: radial-gradient(ellipse at 50% 0%, #eeedff 0, transparent 42%), var(--bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .app { width: min(100%, 500px); }
    .brand { display: flex; align-items: center; justify-content: center; gap: 9px; margin-bottom: 23px; color: #69738a; font-size: 13px; font-weight: 650; letter-spacing: .06em; text-transform: uppercase; }
    .brand-mark { display: grid; width: 27px; height: 27px; place-items: center; border-radius: 9px; color: white; background: var(--accent); font-size: 15px; }
    .card { overflow: hidden; padding: 38px 38px 30px; border: 1px solid rgba(226,229,239,.9); border-radius: 25px; background: var(--paper); box-shadow: 0 20px 60px rgba(35,42,74,.09), 0 2px 8px rgba(35,42,74,.03); }
    .eyebrow { margin: 0 0 10px; color: var(--accent); font-size: 12px; font-weight: 750; letter-spacing: .12em; text-align: center; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(28px, 7vw, 38px); font-weight: 760; letter-spacing: -.045em; text-align: center; }
    .intro { margin: 12px auto 27px; max-width: 340px; color: var(--muted); font-size: 15px; line-height: 1.6; text-align: center; }
    form { display: flex; gap: 10px; }
    .input-wrap { position: relative; flex: 1; min-width: 0; }
    input { width: 100%; height: 54px; padding: 0 15px; border: 1px solid #dfe3ed; border-radius: 13px; outline: none; background: #fcfcfe; color: var(--ink); font: inherit; font-size: 17px; transition: border-color .2s, box-shadow .2s, background .2s; }
    input::placeholder { color: #a7afbf; }
    input:focus { border-color: #8e85f1; background: #fff; box-shadow: 0 0 0 4px rgba(101,88,232,.12); }
    button { height: 54px; padding: 0 19px; border: 0; border-radius: 13px; color: #fff; background: var(--accent); font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; transition: transform .18s, background .18s, box-shadow .18s; box-shadow: 0 5px 12px rgba(101,88,232,.2); }
    button:hover { transform: translateY(-1px); background: var(--accent-dark); box-shadow: 0 8px 16px rgba(101,88,232,.25); }
    button:active { transform: translateY(0) scale(.98); }
    button:focus-visible { outline: 3px solid #aaa4fa; outline-offset: 3px; }
    .hint { margin: 11px 0 0; color: #9aa2b1; font-size: 12px; text-align: center; }
    .result { min-height: 154px; margin-top: 25px; padding: 20px 15px 15px; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 1px solid var(--line); border-radius: 17px; background: #fbfbfd; text-align: center; transition: background .3s, border-color .3s; }
    .result[hidden] { display: none; }
    .result.prime { border-color: #c9ecdc; background: #f2fbf6; }
    .result.composite { border-color: #f1d4d9; background: #fff6f7; }
    .result.invalid { border-color: #f0e2c9; background: #fffbf3; }
    .visual { position: relative; display: grid; width: 52px; height: 52px; place-items: center; margin-bottom: 10px; border-radius: 50%; font-size: 24px; }
    .prime .visual { color: var(--green); background: #def5e8; animation: pop .55s cubic-bezier(.2,1.8,.4,1) both; }
    .composite .visual { color: var(--red); background: #fde5e8; animation: wobble .55s ease both; }
    .invalid .visual { color: #a77a26; background: #f9efda; animation: pop .4s ease both; }
    .result-title { margin: 0; font-size: 19px; font-weight: 760; letter-spacing: -.02em; }
    .prime .result-title { color: var(--green); }
    .composite .result-title { color: var(--red); }
    .invalid .result-title { color: #9b7227; }
    .result-detail { margin: 5px 0 0; color: #788296; font-size: 13px; line-height: 1.45; }
    .prime .visual::after { content: ""; position: absolute; inset: -7px; border: 2px solid rgba(22,134,95,.35); border-radius: 50%; animation: ring .9s ease-out both; }
    .footer { margin: 18px 0 0; color: #a1a8b6; font-size: 11px; text-align: center; }
    @keyframes pop { from { opacity: 0; transform: scale(.45) rotate(-14deg); } to { opacity: 1; transform: scale(1) rotate(0); } }
    @keyframes ring { from { opacity: .8; transform: scale(.65); } to { opacity: 0; transform: scale(1.5); } }
    @keyframes wobble { 0% { transform: scale(.6); } 55% { transform: scale(1.1) rotate(-8deg); } 75% { transform: scale(.96) rotate(5deg); } 100% { transform: scale(1) rotate(0); } }
    @media (max-width: 480px) { .card { padding: 31px 22px 24px; } form { flex-direction: column; } button { width: 100%; } .result { margin-top: 19px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main class="app">
    <div class="brand"><span class="brand-mark" aria-hidden="true">π</span> Mini laboratorio</div>
    <section class="card" aria-labelledby="heading">
      <p class="eyebrow">Matemáticas en un instante</p>
      <h1 id="heading">¿Es un número primo?</h1>
      <p class="intro">Escribe un número entero y descubre si solo puede dividirse entre 1 y sí mismo.</p>
      <form id="prime-form" novalidate>
        <div class="input-wrap">
          <label for="number" class="sr-only" style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0">Número entero</label>
          <input id="number" name="number" type="text" inputmode="numeric" autocomplete="off" placeholder="Por ejemplo: 17" aria-describedby="hint" required>
        </div>
        <button type="submit">Comprobar <span aria-hidden="true">→</span></button>
      </form>
      <p id="hint" class="hint">Admite enteros desde 0 hasta 18 446 744 073 709 551 615.</p>
      <section id="result" class="result" aria-live="polite" aria-atomic="true" hidden>
        <div class="visual" aria-hidden="true"></div>
        <h2 class="result-title"></h2>
        <p class="result-detail"></p>
      </section>
      <p class="footer">Un número primo tiene exactamente dos divisores positivos.</p>
    </section>
  </main>
  <script>
    const form = document.querySelector('#prime-form');
    const input = document.querySelector('#number');
    const result = document.querySelector('#result');
    const visual = result.querySelector('.visual');
    const title = result.querySelector('.result-title');
    const detail = result.querySelector('.result-detail');
    const MAX = 18446744073709551615n;

    function modPow(base, exponent, modulus) {
      let value = 1n;
      base %= modulus;
      while (exponent > 0n) {
        if (exponent & 1n) value = value * base % modulus;
        base = base * base % modulus;
        exponent >>= 1n;
      }
      return value;
    }

    // Miller–Rabin with this base set is deterministic for unsigned 64-bit integers.
    function isPrime(n) {
      if (n < 2n) return false;
      const small = [2n, 3n, 5n, 7n, 11n, 13n, 17n, 19n, 23n, 29n, 31n, 37n];
      for (const p of small) {
        if (n === p) return true;
        if (n % p === 0n) return false;
      }
      let d = n - 1n;
      let s = 0;
      while ((d & 1n) === 0n) { d >>= 1n; s++; }
      const bases = [2n, 325n, 9375n, 28178n, 450775n, 9780504n, 1795265022n];
      for (const a of bases) {
        if (a % n === 0n) continue;
        let x = modPow(a, d, n);
        if (x === 1n || x === n - 1n) continue;
        let witness = true;
        for (let r = 1; r < s; r++) {
          x = x * x % n;
          if (x === n - 1n) { witness = false; break; }
        }
        if (witness) return false;
      }
      return true;
    }

    function show(type, icon, heading, message) {
      result.className = `result ${type}`;
      visual.textContent = icon;
      title.textContent = heading;
      detail.textContent = message;
      result.hidden = false;
      // Restart the entry animation when the user checks another number.
      visual.style.animation = 'none';
      requestAnimationFrame(() => { visual.style.animation = ''; });
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const raw = input.value.trim().replace(/[\s,_]/g, '');
      if (!/^[+-]?\d+$/.test(raw)) {
        show('invalid', '!', 'Ingresa un entero válido', 'Usa solo dígitos y, si hace falta, un signo.');
        input.focus();
        return;
      }
      let n;
      try { n = BigInt(raw); } catch { n = -1n; }
      if (n < 0n || n > MAX) {
        show('invalid', '!', 'Número fuera del rango', 'Ingresa un entero entre 0 y 18 446 744 073 709 551 615.');
        input.focus();
        return;
      }
      const formatted = n.toLocaleString('es-CO');
      if (isPrime(n)) {
        show('prime', '✦', `${formatted} es primo`, '¡Solo tiene dos divisores: 1 y el mismo número!');
      } else if (n < 2n) {
        show('composite', '×', `${formatted} no es primo`, 'Los números primos son enteros mayores que 1.');
      } else {
        show('composite', '×', `${formatted} no es primo`, 'Tiene divisores además de 1 y de sí mismo.');
      }
    });
  </script>
</body>
</html>
